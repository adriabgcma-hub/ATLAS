[package]
name = "atlas-next"
version = "0.1.0"
description = "Atlas Next - interfaz visual para macOS"
authors = ["Adria"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "atlas_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1", features = ["derive"] }
atlas-core = { path = "../crates/atlas-core" }
atlas-mac = { path = "../crates/atlas-mac" }
# Versiones fijadas a las ya presentes en Cargo.lock (dependencias transitivas
# de Tauri 2.11), reutilizadas sin subir el lockfile completo.
objc2 = "0.6"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
