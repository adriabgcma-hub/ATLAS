[Service]
# Red de seguridad si mbpfan muere sin señal (SIGKILL): devuelve el
# ventilador al modo automático del SMC. Al parar con SIGTERM ya lo hace
# mbpfan; repetirlo aquí es inofensivo e idempotente.
ExecStopPost=/bin/sh -c 'echo 0 > /sys/devices/platform/applesmc.768/fan1_manual 2>/dev/null || true'
