# Curva de ventilador de atlas-hub (MacBookPro12,1) — fuente versionada.
# Semántica real de mbpfan 2.4: sube por encima de high_temp y alcanza el
# máximo en max_temp; low_temp es el suelo de histéresis (por debajo, mínimo).
# Para "arrancar a 50 °C" el disparo es high_temp = 50.
[general]
min_fan1_speed = 1300
max_fan1_speed = 6200
low_temp = 45
high_temp = 50
max_temp = 80
polling_interval = 2
